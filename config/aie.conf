# AIE-OS global configuration file
#
# model_path  : Filesystem path to the ONNX model used by the ONNX classifier.
#               Change this value when installing or updating a new model.
# classifier  : "heuristic" or "onnx" (default: heuristic).  When set to
#               "onnx" daemon will attempt to load the model at model_path and
#               perform ML inference.  If the model is missing or fails to
#               load, heuristic logic is used as a fallback.
#
# Example:
# model_path=/usr/local/share/aie-os/model.onnx
# classifier=onnx

model_path=/usr/local/share/aie-os/model.onnx
classifier=heuristic
